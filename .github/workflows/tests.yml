name: tests

# Manual only until the path repositories are replaced by published versions.
on:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, intl
          coverage: none

      # The path repositories (../laravel-moloni, ../laravel-eupago) cannot be resolved on CI until
      # those packages are published; switch to published constraints before enabling this workflow.
      - run: composer update --prefer-dist --no-interaction --no-progress

      - run: vendor/bin/pint --test

      - run: vendor/bin/phpstan analyse --no-progress

      - run: vendor/bin/pest
